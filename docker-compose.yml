version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sanskritipulse_postgres
    environment:
      POSTGRES_DB: sanskritipulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sanskritipulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanskritipulse_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: sanskritipulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data: